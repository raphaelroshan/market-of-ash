name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Policy checks
        run: python tools/policy_check.py --repo "${GITHUB_REPOSITORY}"
      - name: Validate content manifest
        run: python tools/validate_content.py --manifest content/content_manifest.json

  tests:
    name: Godot headless tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Verify Godot
        run: godot --version
      - name: Run deterministic tests
        run: bash scripts/verify.sh

  ai-review:
    name: Multi-agent AI review
    runs-on: ubuntu-latest
    if: always()
    needs: [policy, tests]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_REVIEW_MODELS: ${{ vars.AI_REVIEW_MODELS || 'gpt-5-mini' }}
      AI_REVIEW_REQUIRED: ${{ vars.AI_REVIEW_REQUIRED || 'false' }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AI client when enabled
        if: env.OPENAI_API_KEY != ''
        run: python -m pip install --disable-pip-version-check "openai>=1,<2"
      - name: Build review diff
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p artifacts
          base="$PR_BASE"
          if [ -z "$base" ] || ! git rev-parse "$base^{commit}" >/dev/null 2>&1; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          git diff --no-ext-diff "$base" HEAD > artifacts/change.diff
          echo "Reviewing diff from $base to HEAD"
      - name: Run independent reviewers
        run: |
          python tools/ai_review_runner.py \
            --diff artifacts/change.diff \
            --repo "${GITHUB_REPOSITORY}" \
            --contract ci/quality_contract.md \
            --output artifacts/ai_review.json \
            --fail-on critical
      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package release candidate
    runs-on: windows-latest
    needs: [policy, tests, ai-review]
    if: needs.policy.result == 'success' && needs.tests.result == 'success' && needs.ai-review.result != 'failure'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Import and validate project
        run: godot --headless --path . --editor --quit
      - name: Export Windows build when presets exist
        run: |
          mkdir -p build artifacts
          slug=$(python -c "import json; print(json.load(open('tools/ci_manifest.json'))['slug'])")
          if [ -f export_presets.cfg ]; then
            godot --headless --path . --export-release "Windows Desktop" "build/${slug}.exe"
          else
            echo "No export_presets.cfg yet; packaging source and test evidence only."
          fi
      - name: Package source snapshot
        run: |
          mkdir -p artifacts
          slug=$(python -c "import json; print(json.load(open('tools/ci_manifest.json'))['slug'])")
          tar --exclude=.git --exclude=.godot --exclude=artifacts --exclude=build -czf "artifacts/${slug}-source-${GITHUB_SHA}.tar.gz" .
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.run_number }}
          path: |
            build/
            artifacts/
          if-no-files-found: error
          retention-days: 30
